name: Set up build and browser tools
description: Pinned Linux toolchain for the current web and Typst product
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.14.3'
    - name: Prepare project wrappers and pinned Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        TASK_TOOLS_ROOT="$RUNNER_TEMP/materiewelle-tools"
        mkdir -p "$TASK_TOOLS_ROOT"
        ln -s "$JAVA_HOME" "$TASK_TOOLS_ROOT/jdk-21"
        ln -s "$(dirname "$(dirname "$(command -v gradle)")")" "$TASK_TOOLS_ROOT/gradle-8.14.3"
        cp tools/build/gradle-run "$TASK_TOOLS_ROOT/gradle-run"
        chmod +x "$TASK_TOOLS_ROOT/gradle-run"
        python -m venv "$TASK_TOOLS_ROOT/typst"
        "$TASK_TOOLS_ROOT/typst/bin/python" -m pip install -r content/typst/requirements.txt -r tools/browser/requirements.txt
        "$TASK_TOOLS_ROOT/typst/bin/python" -m pip check
        printf 'TASK_TOOLS_ROOT=%s\n' "$TASK_TOOLS_ROOT" >> "$GITHUB_ENV"
        printf '%s\n' "$TASK_TOOLS_ROOT/typst/bin" >> "$GITHUB_PATH"
        printf 'PLAYWRIGHT_BROWSERS_PATH=%s/playwright-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Install Chromium and PDF tools
      shell: bash
      run: |
        python -m playwright install --with-deps chromium
        sudo apt-get update
        sudo apt-get install -y poppler-utils fontconfig fonts-lmodern fonts-urw-base35 fonts-noto-core fonts-dejavu-core
        python .github/scripts/release_browser.py --github-env "$GITHUB_ENV"
